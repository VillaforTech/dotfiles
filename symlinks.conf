# Symlink mappings: source:target
# Only ${DOTFILES_ROOT}, ${HOME}, or absolute paths are accepted. No shell
# expression is evaluated by scripts/link-config.
# zsh
${DOTFILES_ROOT}/zsh/.zshrc:${HOME}/.zshrc
${DOTFILES_ROOT}/zsh/.zshenv:${HOME}/.zshenv
${DOTFILES_ROOT}/zsh/.zprofile:${HOME}/.zprofile
${DOTFILES_ROOT}/zsh/custom.zsh:${HOME}/.config/zsh/custom.zsh
${DOTFILES_ROOT}/zsh/aliases.zsh:${HOME}/.config/zsh/aliases.zsh
${DOTFILES_ROOT}/zsh/git-completion.bash:${HOME}/.config/zsh/git-completion.bash
${DOTFILES_ROOT}/zsh/git-completion.zsh:${HOME}/.config/zsh/git-completion.zsh
# starship
${DOTFILES_ROOT}/starship/starship.toml:${HOME}/.config/starship/starship.toml
# nvim
${DOTFILES_ROOT}/nvim:${HOME}/.config/nvim
# tmux
${DOTFILES_ROOT}/tmux/tmux.conf:${HOME}/.config/tmux/tmux.conf
${DOTFILES_ROOT}/tmux/nord-theme.conf:${HOME}/.config/tmux/nord-theme.conf
${DOTFILES_ROOT}/tmux/onedark-theme.conf:${HOME}/.config/tmux/onedark-theme.conf
${DOTFILES_ROOT}/scripts/tmux-secure-resurrect:${HOME}/.local/bin/tmux-secure-resurrect
${DOTFILES_ROOT}/scripts/work:${HOME}/.local/bin/work
${DOTFILES_ROOT}/scripts/with-dev-secrets:${HOME}/.local/bin/with-dev-secrets
# wezterm
${DOTFILES_ROOT}/wezterm:${HOME}/.config/wezterm
# ranger
${DOTFILES_ROOT}/ranger:${HOME}/.config/ranger
# git policy (identity remains in the private ~/.gitconfig)
${DOTFILES_ROOT}/git/config:${HOME}/.config/git/config
